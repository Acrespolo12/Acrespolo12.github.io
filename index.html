  let pool=AL.filter((c,i)=>ok(c)&&!S.used.includes(i)&&(!only||c[0]===only));
  if(!pool.length){S.used=[];pool=AL.filter(c=>ok(c)&&(!only||c[0]===only))}
  if(!pool.length&&ph){pool=AL.filter(c=>c[1]<=cap()&&(c[0]==="mia"||(S.lim[0][c[0]]>0&&S.lim[1][c[0]]>0)))}if(!pool.length){toast("No hay cartas posibles: revisad los límites.");return}
  const w=c=>(theme()[1].includes(c[0])?2:0)+1+(S.lim[rcv][c[0]]===2?3:0)+Math.max(0,S.fb[rcv][c[0]]||0)+(wish&&S.lim[t][c[0]]===2?2:0);
  let sum=pool.reduce((a,c)=>a+w(c),0),r=Math.random()*sum,pick=pool[0];

  save();render()
}

  save();render()
}
